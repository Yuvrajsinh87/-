            body { background: white; margin: 0; }

        .letter-box:last-child { border-bottom: none; }

<div class="container no-print">
    <h2>ITI - Ocha Taka Hajari Patra Generator</h2>
    
    <!-- Student 1 -->
    <div class="form-section">
        <h3>Vidyarthi 1 (Uparno Bhag)</h3>
        <div class="form-group">
            <label>Roll Number nakho (1 to 96):</label>
            <input type="text" id="roll1" placeholder="Dah. 1, 50, 96..." oninput="fetchStudent(1)">
        </div>
        <div class="form-group">
            <label>Name (English):</label>
            <input type="text" id="name1" readonly style="background: #e9ecef;">
        </div>
        <div class="form-group">
            <label>Address (English):</label>
            <input type="text" id="address1" readonly style="background: #e9ecef;">
        </div>

                <input type="text" id="month1" value="Jun">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Attendance Percentage:</label>
                <input type="text" id="pct1" placeholder="Dah. 62%">
            </div>
        </div>
    </div>

    <!-- Student 2 -->

            <input type="text" id="roll2" placeholder="Dah. 2, 96..." oninput="fetchStudent(2)">

        <div class="form-group">
            <label>Name (English):</label>
            <input type="text" id="name2" readonly style="background: #e9ecef;">
        </div>
        <div class="form-group">
            <label>Address (English):</label>
            <input type="text" id="address2" readonly style="background: #e9ecef;">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Attendance Month:</label>
                <input type="text" id="month2" value="Jun">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Attendance Percentage:</label>
                <input type="text" id="pct2" placeholder="Dah. 58%">
            </div>
        </div>
    </div>

    <button onclick="generateLetters()">Patra Banavo ane Print Karo</button>
</div>

    function fetchStudent(boxNum) {
        let rVal = document.getElementById("roll" + boxNum).value.trim();
        let st = database.find(s => s.roll === rVal);
        if (st) {
            document.getElementById("name" + boxNum).value = st.name;
            document.getElementById("address" + boxNum).value = st.address;
        } else {
            document.getElementById("name" + boxNum).value = "";
            document.getElementById("address" + boxNum).value = "";
        }
    }

    function getLetterHTML(s, m, p) {
        let dt = new Date().toLocaleDateString('gu-IN');
        let yr = s.examYear.length === 4 ? s.examYear.slice(-2) : s.examYear;
        return `
            <div class="header-right">
                જા.નં./ઔ. તા. સંસ્થા/તાલીમ/ઓછા ટકા/<br>
                આચાર્યશ્રીની કચેરી,<br>
                ઔદ્યોગિક તાલીમ સંસ્થા, અંકલેશ્વર<br>
                તા. ${dt}
            </div>
            <p><strong>પ્રતિ,</strong><br>શ્રી ${s.name}<br>${s.address}</p>
            <p><strong>શ્રીમાન,</strong><br>
            આથી આપને જણાવવાનું કે તમારા પાલ્ય/પુત્ર. ${s.name} અત્રેની સંસ્થામાં ટ્રેડ ${s.trade} બેચ નં. ${s.batch} માં અભ્યાસ કરે છે. અને તેઓની હાજરી ૮૦% કરતાં ઓછી થાય છે. જેથી તેને જુલાઈ ૨૦${yr} માં થનારી અખિલ ભારતીય વ્યવસાય કસોટીમાં બેસવા દેવામાં આવશે નહિ. સંસ્થામાંથી તેઓને વારંવાર સુચના આપવામાં આવે છે. છતાં તેઓ વારંવાર ગેરહાજર રહે છે. તેથી તેમની હાજરી ૮૦% કરતાં ઓછી થાય છે. હાજરીના ટકા જો જુલાઈ ૨૦${yr} સુધીમાં ૮૦% થશે તોજ તેને જુલાઈ ૨૦${yr} ની પરીક્ષામાં બેસવા દેવાની મંજુરી આપવામાં આવશે જેની નોંધ લેવા વિનંતી.</p>
            <p><strong>નોંધ :-</strong> ${m} સુધીમાં હાજરી ${p} થાય છે.</p>
            <table width="100%" style="margin-top: 10px;">
                <tr>
                    <td>ટ્રેડ ઈન્સ્ટ્ર.</td>
                    <td align="center">ફો. ઈ.</td>
                    <td align="right">આચાર્ય / ફોરમેન<br>ઔદ્યોગિક તાલીમ સંસ્થા, અંકલેશ્વર</td>
                </tr>
            </table>
            <p>નકલ રવાના :- શ્રી ${s.instructor} સુ. ઈ.</p>
        `;
    }

    function generateLetters() {
        let r1 = document.getElementById("roll1").value.trim();
        let s1 = database.find(s => s.roll === r1);
        if (!s1) { alert("વિદ્યાર્થી ૧ નો સાચો રોલ નંબર નાખો!"); return; }
        let m1 = document.getElementById("month1").value || "જૂન";
        let p1 = document.getElementById("pct1").value || "૦%";

        let r2 = document.getElementById("roll2").value.trim();
        let s2 = r2 !== "" ? database.find(s => s.roll === r2) : s1;
        let m2 = document.getElementById("month2").value || "જૂન";
        let p2 = document.getElementById("pct2").value || p1;

        let content = `
            <div class="letter-page">
                <div class="letter-box">${getLetterHTML(s1, m1, p1)}</div>
                <hr style="border-top: 1px dashed black; margin: 5px 0;">
                <div class="letter-box">${getLetterHTML(s2, m2, p2)}</div>
            </div>
        `;

        let pArea = document.getElementById("printArea");
        pArea.innerHTML = content;
        pArea.style.display = "block";
        window.print();
    }
